<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - SA Móveis</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Archivo+Black&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --vermelho-sa: #b90c29;
            --azul-sa: #0047BB;
            --azul-escuro: #003087;
            --branco: #ffffff;
            --cinza-bg: #f4f5f7;
            --cinza-card: #ffffff;
            --cinza-borda: #dcdcdc;
            --texto: #1e1e1e;
            --shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--cinza-bg);
            color: var(--texto);
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .topo {
            background: linear-gradient(135deg, var(--vermelho-sa), var(--azul-sa));
            border-radius: 18px;
            padding: 30px;
            color: white;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }

        .topo h1 {
            font-family: 'Archivo Black', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .topo p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: var(--cinza-card);
            border-radius: 18px;
            padding: 25px;
            box-shadow: var(--shadow);
        }

        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--azul-escuro);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        input,
        textarea,
        select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            background: #fff;
            margin-bottom: 10px;
        }

        input:focus,
        textarea:focus {
            border-color: var(--azul-sa);
            box-shadow: 0 0 0 4px rgba(0,71,187,0.10);
        }

        .bloco-card {
            margin-bottom: 25px;
        }

        .bloco-card label {
            display: block;
            font-weight: 700;
            color: var(--azul-escuro);
            margin-bottom: 10px;
        }

        .bloco-card select {
            margin-bottom: 10px;
            cursor: pointer;
        }

        .bloco-card small {
            color: #555;
            font-weight: 500;
        }


        .btn {
            border: none;
            border-radius: 12px;
            padding: 14px 18px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--vermelho-sa), #8e081f);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(185,12,41,0.25);
        }

        .btn-download {
            background: linear-gradient(135deg, var(--azul-sa), var(--azul-escuro));
            color: white;
            margin-bottom: 18px;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0,71,187,0.25);
        }

        .produto-item {
            border: 1px solid var(--cinza-borda);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            transition: 0.3s;
        }

        .produto-item:hover {
            border-color: var(--azul-sa);
            transform: translateY(-2px);
        }

        .produto-info h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .produto-info p {
            color: #555;
            font-weight: 500;
        }

        .acoes {
            display: flex;
            gap: 10px;
        }

        .btn-edit {
            background: var(--azul-sa);
            color: white;
        }

        .btn-remove {
            background: var(--vermelho-sa);
            color: white;
        }

        .btn-edit,
        .btn-remove {
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn-edit:hover,
        .btn-remove:hover {
            transform: scale(1.05);
        }

        textarea {
            min-height: 300px;
            resize: vertical;
            font-family: monospace;
        }

.btn-stock {

<input type="text" id="pesquisaAdmin" placeholder="Buscar produto para editar...">

        <div class="card" style="margin-top:25px;">

            </button>

            <div class="json-wrapper">
    <button type="button" class="btn-copy-json" id="copiarJson">
        Copiar
    </button>

</div>

    <script>

    // ===============================
    // DADOS PRINCIPAIS
    // ===============================
    const blocosPadrao = {
        bloco1: [],
        bloco2: [],
        bloco3: [],
        bloco4: [],
        bloco5: []
    };

    function carregarProdutos() {
        const dadosSalvos = JSON.parse(localStorage.getItem("produtos")) || {};

        if (Array.isArray(dadosSalvos)) {
            return {
                bloco1: dadosSalvos,
                bloco2: [],
                bloco3: [],
                bloco4: [],
                bloco5: []
            };
        }

        return {
            bloco1: dadosSalvos.bloco1 || dadosSalvos.roupeiros || [],
            bloco2: dadosSalvos.bloco2 || dadosSalvos.sofas || [],
            bloco3: dadosSalvos.bloco3 || dadosSalvos.mesas || [],
            bloco4: dadosSalvos.bloco4 || dadosSalvos.camas || [],
            bloco5: dadosSalvos.bloco5 || dadosSalvos.eletros || []
        };
    }

    let produtos = carregarProdutos();
    let produtoEditando = null;

    // ===============================
    // ELEMENTOS DO HTML
    // ===============================
    const form = document.getElementById("formProduto");
    const lista = document.getElementById("listaProdutosAdmin");
    const jsonGerado = document.getElementById("jsonGerado");
    const baixarJson = document.getElementById("baixarJson");
    const botaoSubmit = form.querySelector("button[type='submit']");
    const pesquisaAdmin = document.getElementById("pesquisaAdmin");
    const copiarJson = document.getElementById("copiarJson");
    const blocoAtual = document.getElementById("blocoAtual");

    const nomeInput = document.getElementById("nome");
    const precoInput = document.getElementById("preco");
    const precoCartaoInput = document.getElementById("precoCartao");
    const parcelasInput = document.getElementById("parcelas");
    const imagemInput = document.getElementById("imagem");
    const linkInput = document.getElementById("link");
    const imagensExtrasInput = document.getElementById("imagensExtras");
    const resumoInput = document.getElementById("resumo");
    const descricaoCompletaInput = document.getElementById("descricaoCompleta");

    // ===============================
    // FUNÇÕES DOS BLOCOS
    // ===============================
    function pegarBlocoAtual() {
        return blocoAtual.value;
    }

    function pegarProdutosDoBlocoAtual() {
        const bloco = pegarBlocoAtual();

        if (!produtos[bloco]) {
            produtos[bloco] = [];
        }

        return produtos[bloco];
    }

    function salvarProdutos() {
        localStorage.setItem("produtos", JSON.stringify(produtos));
        jsonGerado.value = JSON.stringify(produtos, null, 4);
    }

    // ===============================
    // FORMATAR PREÇO EM REAL
    // ===============================
    function formatarMoeda(input) {
        let valor = input.value.replace(/\D/g, "");

        valor = (Number(valor) / 100).toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
        });

        input.value = valor;
    }

    precoInput.addEventListener("input", function () {
        formatarMoeda(precoInput);
    });

    precoCartaoInput.addEventListener("input", function () {
        formatarMoeda(precoCartaoInput);
    });

    // ===============================
    // CALCULAR VALOR DA PARCELA
    // ===============================
    function calcularParcela(precoCartao, quantidadeParcelas) {
        const valorNumerico = Number(precoCartao.replace(/\D/g, "")) / 100;
        const parcelas = Number(quantidadeParcelas);

        if (!valorNumerico || !parcelas) {
            return "R$ 0,00";
        }

        const valorParcela = valorNumerico / parcelas;

        return valorParcela.toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
        });
    }

    // ===============================
    // GERAR ID E LINK
    // ===============================
    function criarIdProduto(nome) {
        return nome
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "");
    }

    function transformarLinhasEmArray(texto) {
        return texto
            .split("\n")
            .map(item => item.trim())
            .filter(item => item !== "");
    }

    function gerarLinkProduto() {
        const idProduto = criarIdProduto(nomeInput.value);

        if (!idProduto) {
            linkInput.value = "";
            return;
        }

        linkInput.value = `pagina-produtos/produto.html?id=${idProduto}`;
    }

    nomeInput.addEventListener("input", gerarLinkProduto);

    // ===============================
    // VERIFICAR ID REPETIDO
    // ===============================
    function idProdutoJaExiste(idProduto, indexIgnorado = null) {
        const blocoSelecionado = pegarBlocoAtual();

        for (const nomeBloco in produtos) {
            const listaDoBloco = produtos[nomeBloco] || [];

            for (let i = 0; i < listaDoBloco.length; i++) {
                const mesmoProdutoEditado =
                    nomeBloco === blocoSelecionado &&
                    i === indexIgnorado;

                if (!mesmoProdutoEditado && listaDoBloco[i].id === idProduto) {
                    return true;
                }
            }
        }

        return false;
    }

    // ===============================
    // ADICIONAR OU SALVAR ALTERAÇÃO
    // ===============================
    form.addEventListener("submit", function (e) {
        e.preventDefault();

        const idProduto = criarIdProduto(nomeInput.value);
        const imagemPrincipal = imagemInput.value.trim();

        if (!idProduto) {
            alert("Digite um nome válido para o produto.");
            return;
        }

        if (idProdutoJaExiste(idProduto, produtoEditando)) {
            alert(`Já existe um produto com o ID "${idProduto}". Altere um pouco o nome do produto para gerar outro link.`);
            return;
        }

        const imagensExtras = transformarLinhasEmArray(imagensExtrasInput.value);

        const imagensProduto = [
            imagemPrincipal,
            ...imagensExtras
        ].filter(imagem => imagem !== "");

        const descricaoProduto = transformarLinhasEmArray(descricaoCompletaInput.value);

        const produtosDoBloco = pegarProdutosDoBlocoAtual();

        const produtoAnterior = produtoEditando !== null
            ? produtosDoBloco[produtoEditando]
            : null;

        const produto = {
            id: idProduto,
            nome: nomeInput.value.trim(),
            preco: precoInput.value,
            precoCartao: precoCartaoInput.value,
            parcelas: Number(parcelasInput.value),
            valorParcela: calcularParcela(precoCartaoInput.value, parcelasInput.value),

            imagem: imagemPrincipal,
            imagens: imagensProduto,

            resumo: resumoInput.value.trim(),
            descricao: descricaoProduto,

            esgotado: produtoAnterior ? produtoAnterior.esgotado === true : false,

            link: `pagina-produtos/produto.html?id=${idProduto}`
        };

        if (produtoEditando === null) {
            const confirmarAdicao = confirm(
                `Deseja realmente adicionar o produto "${produto.nome}" neste bloco?`
            );

            if (!confirmarAdicao) {
                return;
            }

            produtosDoBloco.push(produto);
        } else {
            const confirmarEdicao = confirm(
                `Deseja realmente salvar as alterações do produto "${produto.nome}"?`
            );

            if (!confirmarEdicao) {
                return;
            }

            produtosDoBloco[produtoEditando] = produto;

            produtoEditando = null;
            botaoSubmit.textContent = "Adicionar produto";
        }

        salvarProdutos();
        form.reset();

        document.getElementById("previewImagemProduto").style.display = "none";
        document.getElementById("previewImagemProduto").src = "";

        gerarLinkProduto();
        atualizarTela();
    });

    // ===============================
    // ATUALIZAR LISTA NA TELA
    // ===============================
    function atualizarTela() {
        lista.innerHTML = "";

        const termo = pesquisaAdmin.value.toLowerCase().trim();
        const produtosDoBloco = pegarProdutosDoBlocoAtual();

        let encontrouProduto = false;

        produtosDoBloco.forEach((produto, index) => {
            const nomeProduto = produto.nome.toLowerCase();

            if (!nomeProduto.includes(termo)) {
                return;
            }

            encontrouProduto = true;

            lista.innerHTML += `
                <div class="produto-item">
                    <div class="produto-info">
                        <h3>${produto.nome}</h3>
                        <p>${produto.preco}</p>

                        <small>
                            Cartão: ${produto.precoCartao} em ${produto.parcelas}x de ${produto.valorParcela}
                        </small>

                        ${produto.esgotado ? '<span class="status-esgotado-admin">ESGOTADO</span>' : ''}
                    </div>

                    <div class="acoes">
                        <button 
                            class="btn-stock ${produto.esgotado ? 'esgotado' : ''}" 
                            onclick="alternarEsgotado(${index})">
                            ${produto.esgotado ? 'Disponível' : 'Esgotar'}
                        </button>

                        <button class="btn-edit" onclick="editarProduto(${index})">
                            Editar
                        </button>

                        <button class="btn-remove" onclick="removerProduto(${index})">
                            Remover
                        </button>
                    </div>
                </div>
            `;
        });

        if (!encontrouProduto) {
            lista.innerHTML = `
                <div class="produto-item">
                    <div class="produto-info">
                        <h3>Nenhum produto neste bloco</h3>
                        <p>Cadastre um produto para este bloco selecionado.</p>
                    </div>
                </div>
            `;
        }

        jsonGerado.value = JSON.stringify(produtos, null, 4);
    }

    // ===============================
    // PRÉVIA DA IMAGEM
    // ===============================
    function mostrarPreviewImagem() {
        const caminhoImagem = imagemInput.value.trim();
        const preview = document.getElementById("previewImagemProduto");

        if (caminhoImagem === "") {
            alert("Coloque o caminho da imagem primeiro.");
            return;
        }

        preview.src = caminhoImagem;
        preview.style.display = "block";

        preview.onerror = function () {
            preview.style.display = "none";
            alert("Imagem não encontrada. Confira se o caminho está correto.");
        };
    }

    // ===============================
    // EDITAR PRODUTO
    // ===============================
    function editarProduto(index) {
        const produto = pegarProdutosDoBlocoAtual()[index];

        nomeInput.value = produto.nome || "";
        precoInput.value = produto.preco || "";
        precoCartaoInput.value = produto.precoCartao || "";
        parcelasInput.value = produto.parcelas || "";
        imagemInput.value = produto.imagem || "";
        linkInput.value = produto.link || "";

        resumoInput.value = produto.resumo || "";

        descricaoCompletaInput.value = Array.isArray(produto.descricao)
            ? produto.descricao.join("\n")
            : "";

        imagensExtrasInput.value = Array.isArray(produto.imagens)
            ? produto.imagens.filter(img => img !== produto.imagem).join("\n")
            : "";

        produtoEditando = index;
        botaoSubmit.textContent = "Salvar alteração";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }

    // ===============================
    // ALTERNAR PRODUTO ESGOTADO
    // ===============================
    function alternarEsgotado(index) {
        const produtosDoBloco = pegarProdutosDoBlocoAtual();
        const produto = produtosDoBloco[index];

        if (!produto) {
            return;
        }

        produto.esgotado = !produto.esgotado;

        salvarProdutos();
        atualizarTela();
    }

    // ===============================
    // REMOVER PRODUTO
    // ===============================
    function removerProduto(index) {
        const produtosDoBloco = pegarProdutosDoBlocoAtual();
        const produto = produtosDoBloco[index];

        const confirmar = confirm(
            `Tem certeza que deseja remover o produto "${produto.nome}"?\n\nEssa ação não pode ser desfeita.`
        );

        if (!confirmar) {
            return;
        }

        produtosDoBloco.splice(index, 1);
        salvarProdutos();
        atualizarTela();
    }

    // ===============================
    // BAIXAR JSON
    // ===============================
    baixarJson.addEventListener("click", function () {
        const conteudo = JSON.stringify(produtos, null, 4);

        const blob = new Blob([conteudo], {
            type: "application/json"
        });

        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "produtos.json";
        link.click();
    });

    // ===============================
    // PESQUISA ADMIN
    // ===============================
    pesquisaAdmin.addEventListener("input", atualizarTela);

    // ===============================
    // TROCAR DE BLOCO
    // ===============================
    blocoAtual.addEventListener("change", function () {
        produtoEditando = null;
        botaoSubmit.textContent = "Adicionar produto";
        pesquisaAdmin.value = "";
        form.reset();

        document.getElementById("previewImagemProduto").style.display = "none";
        document.getElementById("previewImagemProduto").src = "";

        atualizarTela();
    });

    // ===============================
    // COPIAR JSON
    // ===============================
    copiarJson.addEventListener("click", function () {
        navigator.clipboard.writeText(jsonGerado.value).then(function () {
            copiarJson.textContent = "Copiado!";

            setTimeout(function () {
                copiarJson.textContent = "Copiar";
            }, 1500);
        }).catch(function () {
            jsonGerado.select();
            document.execCommand("copy");

            copiarJson.textContent = "Copiado!";

            setTimeout(function () {
                copiarJson.textContent = "Copiar";
            }, 1500);
        });
    });

    atualizarTela();
</script>

</body>
</html>
